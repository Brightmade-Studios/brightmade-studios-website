name: Deploy

# Merging a pull request into main publishes the site. Nothing is deployed by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets GitHub prove to Google which repo and branch is asking

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/check-site.mjs

      # Keyless sign-in to Google Cloud through Workload Identity Federation.
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/328965318405/locations/global/workloadIdentityPools/github/providers/website
          service_account: website-deployer@brightmade-studios.iam.gserviceaccount.com
          token_format: access_token

      - run: node scripts/deploy-hosting.mjs
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          SITE_ID: brightmade-studios
